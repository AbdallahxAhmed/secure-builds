name: 64Gram Windows

# Builds the 64Gram Windows x64 installer (setup.exe) for a ref whose Linux
# build already passed the security scan and created the release
# `64gram-<ref>`. This workflow never scans; "release exists" is the gate.

on:
  schedule:
    # GitHub may delay or drop scheduled runs under load, so check twice a
    # day, off the top of the hour.
    - cron: '5 4 * * *'
    - cron: '35 16 * * *'
  workflow_run:
    workflows: [64Gram]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag to build; defaults to built_ref from state/64gram.json'
        required: false
        type: string
      force:
        description: 'Rebuild and re-upload the setup.exe even if the release already has one'
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: 64gram-windows
  cancel-in-progress: false

jobs:
  decide:
    name: Decide whether to build Windows
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
      ref: ${{ steps.decide.outputs.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve ref and check release
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          set -euo pipefail

          built_ref=""
          if [ -f state/64gram.json ]; then
            built_ref=$(jq -r '.built_ref // ""' state/64gram.json)
          fi

          ref="$INPUT_REF"
          if [ -z "$ref" ]; then
            ref="$built_ref"
          fi

          if [ -z "$ref" ]; then
            echo "::notice::No ref to build (no input ref and state/64gram.json has no built_ref); nothing to do"
            exit 0
          fi

          if [[ ! "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid ref format: $ref"
            exit 1
          fi

          exe="64gram-${ref}-windows-x64-setup.exe"
          if ! assets=$(gh release view "64gram-${ref}" --json assets --jq '.assets[].name'); then
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::Release 64gram-${ref} does not exist; the 64Gram workflow must create it first"
              exit 1
            fi
            echo "::notice::Release 64gram-${ref} does not exist yet; skipping Windows build"
            exit 0
          fi

          proceed=true
          if [ "$FORCE" = "true" ]; then
            echo "force=true; building $exe even if already attached to release 64gram-${ref}"
          elif grep -Fxq "$exe" <<< "$assets"; then
            echo "Asset $exe is already attached to release 64gram-${ref}; use force to rebuild"
            proceed=false
          fi

          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

  build:
    name: Build 64Gram (Windows x64 installer)
    needs: decide
    if: needs.decide.outputs.proceed == 'true'
    runs-on: windows-2025
    timeout-minutes: 355
    permissions:
      contents: read
    steps:
      # Disk space gate: the Qt 6.11.2 static build (Debug + RelWithDebInfo,
      # with PDBs and precompiled headers) once filled the disk after 80
      # minutes and died with C1085 "not enough space on the disk", so delete
      # preinstalled image bloat this build never uses first. Only C: paths
      # are touched, each only if it exists, and removal failures are logged
      # as warnings and never fail the job.
      - name: Free runner disk space
        shell: pwsh
        run: |
          function Show-FreeSpace {
            Get-PSDrive -PSProvider FileSystem | ForEach-Object {
              '{0}: {1:N1} GB free' -f $_.Name, ($_.Free / 1GB)
            }
          }
          Write-Host 'Free space before cleanup:'
          Show-FreeSpace
          # Deliberately kept: Python, Strawberry Perl, Git, CMake, LLVM,
          # Visual Studio, Windows Kits, dotnet, Inno Setup, msys64 and
          # everything under C:\Users.
          $targets = @(
            'C:\Android'
            'C:\ghcup'
            'C:\cabal'
            'C:\tools\kotlinc'
            'C:\Program Files\R'
            'C:\Program Files\MongoDB'
            'C:\Program Files\MySQL'
            'C:\SeleniumWebDrivers'
            'C:\Program Files (x86)\sbt'
            'C:\Program Files\Amazon'
            'C:\ProgramData\chocolatey\lib\maven'
            'C:\ProgramData\chocolatey\lib\pulumi'
            'C:\hostedtoolcache\windows\go'
            'C:\hostedtoolcache\windows\Ruby'
            'C:\hostedtoolcache\windows\PyPy'
            'C:\hostedtoolcache\windows\node'
            'C:\hostedtoolcache\windows\CodeQL'
            'C:\hostedtoolcache\windows\stack'
          )
          $targets += @(Get-ChildItem 'C:\hostedtoolcache\windows' -Filter 'Java_*' -Directory -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          # rmdir /s /q is far faster than Remove-Item on these big trees.
          foreach ($t in $targets) {
            if (-not (Test-Path -LiteralPath $t)) { continue }
            try {
              cmd /c rmdir /s /q "$t" 2>&1 | Out-Null
            } catch {
              Write-Host ('rmdir on {0} failed, continuing: {1}' -f $t, $_)
            }
            if (Test-Path -LiteralPath $t) {
              Write-Host ('::warning::could not fully remove {0}' -f $t)
            }
          }
          Write-Host 'Free space after cleanup:'
          Show-FreeSpace
          # A failed rmdir leaves a nonzero $LASTEXITCODE, which the pwsh
          # wrapper would turn into a job failure; cleanup is best effort.
          exit 0

      # TBuild lives outside the workspace, symlinked in, as in official CI;
      # put the real directory on whichever of C: and D: has more free space
      # right now (the PDB-heavy Qt build once filled C:, C1085).
      - name: Prepare directories
        shell: pwsh
        run: |
          $cFree = (Get-PSDrive -Name C).Free
          Write-Host ('Free space on C: {0:N1} GB' -f ($cFree / 1GB))
          $realRoot = Join-Path $env:USERPROFILE 'TBuild'
          $drive = 'C'
          $d = Get-PSDrive -Name D -ErrorAction SilentlyContinue
          if ($d) {
            Write-Host ('Free space on D: {0:N1} GB' -f ($d.Free / 1GB))
            if ($d.Free -gt $cFree) {
              $realRoot = 'D:\TBuild'
              $drive = 'D'
            }
          } else {
            Write-Host 'D: does not exist; using C:'
          }
          Write-Host ('TBuild on drive {0}: real directory {1}' -f $drive, $realRoot)
          New-Item -ItemType Directory -Path $realRoot -Force -ErrorAction Stop | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $realRoot 'Libraries') -Force -ErrorAction Stop | Out-Null
          $link = Join-Path $env:GITHUB_WORKSPACE 'TBuild'
          try {
            New-Item -ItemType SymbolicLink -Path $link -Target $realRoot -ErrorAction Stop | Out-Null
          } catch {
            throw ('Failed to create symlink {0} -> {1}: {2}' -f $link, $realRoot, $_)
          }
          # Same values as before, all through %GITHUB_WORKSPACE%\TBuild.
          Add-Content -Path $env:GITHUB_ENV -Encoding utf8 -Value "TBUILD=$link"
          Add-Content -Path $env:GITHUB_ENV -Encoding utf8 -Value 'REPO_NAME=tdesktop'
          Add-Content -Path $env:GITHUB_ENV -Encoding utf8 -Value "LibrariesPath=$link\Libraries\win64"
          Add-Content -Path $env:GITHUB_ENV -Encoding utf8 -Value "RELEASEPATH=$link\tdesktop\out\Release"

      - name: Checkout 64Gram
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: TDesktop-x64/tdesktop
          ref: ${{ needs.decide.outputs.ref }}
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: Nested submodules
        env:
          TDESKTOP_DIR: ${{ env.TBUILD }}\${{ env.REPO_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          git -C "$TDESKTOP_DIR/cmake" submodule update --init --recursive --depth=1

      - name: Checkout secure-builds scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: secure-builds

      - name: Apply hardening patches
        env:
          TDESKTOP_DIR: ${{ env.TBUILD }}\${{ env.REPO_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          python secure-builds/scripts/harden_64gram.py "$TDESKTOP_DIR" --windows

      - name: Validate API secrets
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$API_ID" =~ ^[0-9]{3,12}$ ]] || [[ ! "$API_HASH" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::TDESKTOP_API_ID/TDESKTOP_API_HASH secret missing or malformed"
            exit 1
          fi

      # First set up, as in the official Windows workflow: parse the required
      # Windows SDK version from docs/building-win.md, patch the CMake MSVC
      # debug flags module, configure git for cherry-picks, and compute the
      # libraries cache key from prepare.py + SDK version.
      - name: First set up
        env:
          TDESKTOP_DIR: ${{ env.TBUILD }}\${{ env.REPO_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          DOCPATH="$TDESKTOP_DIR/docs/building-win.md"
          SDK="$(grep "SDK version" "$DOCPATH" | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> "$GITHUB_ENV"

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          sha256sum "$TDESKTOP_DIR/Telegram/build/prepare/prepare.py" | awk '{ print $1 }' >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          # Libraries are built with Release variants (no skip-release), so
          # their caches must not be mistaken for official CI's Debug-only ones.
          echo "with-release-libs" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> "$GITHUB_ENV"

          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      # The runner image ships Visual Studio 2026; the MSVC 14.44 toolset that
      # official CI pins is a side-by-side component there, installed without
      # its ATL headers (atlbase.h), which breakpad's Release tools need.
      - name: Add ATL for the MSVC 14.44 toolset
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Write-Host "Visual Studio: $vs"
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $p = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList `
            'modify','--installPath',"`"$vs`"", `
            '--add','Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL', `
            '--quiet','--norestart','--nocache'
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "vs_installer exit code $($p.ExitCode)" }
          $atl = Get-ChildItem "$vs\VC\Tools\MSVC\14.44.*\atlmfc\include\atlbase.h" -ErrorAction SilentlyContinue
          if (-not $atl) { throw "atlbase.h still missing for MSVC 14.44" }
          Write-Host "ATL headers: $($atl.FullName)"

      - name: Native Tools Command Prompt
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: 14.44

      - name: NuGet sources
        shell: cmd
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache (restore)
        id: tp_restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}-partial-
            ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache (restore)
        id: libs_restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v2-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.OS }}-x64-libs-v2-${{ env.CACHE_KEY }}-partial-
            ${{ runner.OS }}-x64-libs-v2-

      - name: Qt cache (restore)
        id: qt_restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.OS }}-x64-qt-${{ env.CACHE_KEY }}-partial-
            ${{ runner.OS }}-x64-qt-

      - name: Libraries
        id: libraries
        continue-on-error: true
        timeout-minutes: 290
        shell: cmd
        run: |
          rem No skip-release (unlike official CI): we build the app in Release,
          rem so the libraries need their Release variants too.
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent

      # Diagnostic: how full the disks are right after the library build,
      # where the last run hit C1085 disk-full; must never fail.
      - name: Disk space after libraries
        if: always()
        shell: pwsh
        run: |
          try {
            Get-PSDrive -PSProvider FileSystem | ForEach-Object {
              '{0}: {1:N1} GB free, {2:N1} GB used' -f $_.Name, ($_.Free / 1GB), ($_.Used / 1GB)
            }
          } catch {
            Write-Host ('Disk space probe failed: {0}' -f $_)
          }
          exit 0

      # Same prune as official CI, but keep tdesktop_rust/out: its generated
      # wallet_engine.cpp is compiled by the app build (official CI's list
      # predates the Rust wallet engine and deletes it).
      - name: Free up disk space
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$LibrariesPath" ]; then
            echo "No libraries directory; skipping prune"
            exit 0
          fi
          find "$LibrariesPath" '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' -o -path '*/tdesktop_rust/out/*' ')' -type f ')' -o -empty ')' -delete

      # Cache entries are immutable. A partial library build (timed out or
      # failed) is saved under a "-partial-<run id>" key so the next run
      # resumes from it; a finished build is saved once under the exact key,
      # and nothing is saved when the exact key was already restored. This
      # keeps the Windows caches from crowding the repo's 10 GB cache budget.
      - name: Choose cache save keys
        if: always()
        env:
          LIBS_OUTCOME: ${{ steps.libraries.outcome }}
          TP_HIT: ${{ steps.tp_restore.outputs.cache-hit }}
          LIBS_HIT: ${{ steps.libs_restore.outputs.cache-hit }}
          QT_HIT: ${{ steps.qt_restore.outputs.cache-hit }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$LIBS_OUTCOME" = "success" ]; then
            suffix=""
            save() { [ "$1" = "true" ] && echo false || echo true; }
          else
            suffix="-partial-$RUN_ID"
            save() { echo true; }
          fi
          {
            echo "CACHE_SAVE_SUFFIX=$suffix"
            echo "SAVE_TP=$(save "$TP_HIT")"
            echo "SAVE_LIBS=$(save "$LIBS_HIT")"
            echo "SAVE_QT=$(save "$QT_HIT")"
          } >> "$GITHUB_ENV"

      - name: ThirdParty cache (save)
        if: always() && env.SAVE_TP == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}${{ env.CACHE_SAVE_SUFFIX }}

      - name: Libraries cache (save)
        if: always() && env.SAVE_LIBS == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v2-${{ env.CACHE_KEY }}${{ env.CACHE_SAVE_SUFFIX }}

      - name: Qt cache (save)
        if: always() && env.SAVE_QT == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt-${{ env.CACHE_KEY }}${{ env.CACHE_SAVE_SUFFIX }}

      - name: Check libraries build
        if: always()
        env:
          LIBS_OUTCOME: ${{ steps.libraries.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$LIBS_OUTCOME" != "success" ]; then
            echo "::error::Libraries build did not succeed (outcome: $LIBS_OUTCOME); libraries partially built and cached; the next scheduled run resumes"
            exit 1
          fi

      # Diagnostic: a detached background monitor samples every cl.exe's
      # private memory (with the .cpp it is compiling) every 30 s into
      # %RUNNER_TEMP%\memlog.txt, so we finally get per-file data on which
      # settings sources ran the compiler out of heap space (C1060) or pushed
      # the 16 GB runner into commit-limit thrash. It keeps writing while the
      # build step below is being killed by its timeout; the runner kills it
      # only when the job ends.
      - name: Start memory monitor
        if: steps.libraries.outcome == 'success'
        shell: pwsh
        run: |
          # Written as an array of single-quoted lines instead of a
          # here-string: a here-string terminator would need to sit flush
          # left, which an indented workflow run block can never give it.
          $monitor = Join-Path $env:RUNNER_TEMP 'memmon.ps1'
          $lines = @(
            '$log = Join-Path $env:RUNNER_TEMP "memlog.txt"'
            'while ($true) {'
            '  try {'
            '    $os = Get-CimInstance Win32_OperatingSystem'
            '    $freePhys = [double]$os.FreePhysicalMemory / 1MB'
            '    $committed = ([double]$os.TotalVirtualMemorySize - [double]$os.FreeVirtualMemory) / 1MB'
            '    $limit = [double]$os.TotalVirtualMemorySize / 1MB'
            '    $stamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")'
            '    $block = New-Object System.Collections.Generic.List[string]'
            '    $block.Add(("{0} freePhys={1:N1}GB committed={2:N1}GB limit={3:N1}GB" -f $stamp, $freePhys, $committed, $limit))'
            '    $cls = @(Get-CimInstance Win32_Process -Filter "Name=''cl.exe''" | Sort-Object PrivatePageCount -Descending | Select-Object -First 8)'
            '    foreach ($cl in $cls) {'
            '      $cmdLine = [string]$cl.CommandLine'
            '      $names = [regex]::Matches($cmdLine, "[\w.+-]+\.(cpp|cxx|cc|c)\b") | ForEach-Object { $_.Value } | Select-Object -Unique'
            '      $src = [string]::Join(",", @($names))'
            '      if (-not $src) { $src = $cmdLine.Substring(0, [Math]::Min(200, $cmdLine.Length)) }'
            '      $age = ((Get-Date) - $cl.CreationDate).TotalMinutes'
            '      $block.Add(("  pid={0} priv={1:N2}GB age={2:N1}min src={3}" -f $cl.ProcessId, ([double]$cl.PrivatePageCount / 1GB), $age, $src))'
            '    }'
            '    Add-Content -Path $log -Encoding utf8 -Value ($block -join [Environment]::NewLine)'
            '  } catch {'
            '    try { Add-Content -Path $log -Encoding utf8 -Value ("  sample failed: {0}" -f $_) } catch { }'
            '  }'
            '  Start-Sleep -Seconds 30'
            '}'
          )
          Set-Content -Path $monitor -Encoding utf8 -Value ($lines -join [Environment]::NewLine)
          # One bad sample must never kill the monitor: its whole loop body is
          # wrapped in try/catch inside the script above.
          Start-Process pwsh -ArgumentList '-NoProfile','-File',$monitor -WindowStyle Hidden
          Write-Host ('Memory monitor started; log: {0}' -f (Join-Path $env:RUNNER_TEMP 'memlog.txt'))
          exit 0

      - name: Telegram Desktop build
        if: steps.libraries.outcome == 'success'
        # The job timeout once killed the whole run mid-build with no
        # diagnostics; kill only this step at 300 minutes and let the
        # diagnostic steps below summarize the monitor log.
        timeout-minutes: 300
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        shell: cmd
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          rem cmake_helpers defaults Release to embedded debug info (/Z7) and a
          rem full PDB link; on the 16 GB runner that ran cl.exe (C1060) and the
          rem final link (LNK1102) out of memory. Crash reports are disabled, so
          rem no PDB is shipped: an empty format turns /Z7 off and links with
          rem /DEBUG:NONE (options_win.cmake keys off this property).
          call configure.bat ^
          x64 ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D TDESKTOP_API_ID=%API_ID% ^
          -D TDESKTOP_API_HASH=%API_HASH% ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT:STRING=

          rem Starts with two compiles at a time because four at a time (/MP,
          rem one cl.exe per core) ran the 16 GB runner out of memory on the
          rem settings sources (C1060 "compiler is out of heap space"). The
          rem build is incremental, so if it still fails finish the remaining
          rem files one at a time instead of starting over.
          cmake --build ..\out --config Release --target Telegram --parallel -- /p:CL_MPCount=2 || cmake --build ..\out --config Release --target Telegram -- /m:1 /p:CL_MPCount=1

      # Diagnostic: how full the disks are right after the app build;
      # must never fail.
      - name: Disk space after app build
        if: always()
        shell: pwsh
        run: |
          try {
            Get-PSDrive -PSProvider FileSystem | ForEach-Object {
              '{0}: {1:N1} GB free, {2:N1} GB used' -f $_.Name, ($_.Free / 1GB), ($_.Used / 1GB)
            }
          } catch {
            Write-Host ('Disk space probe failed: {0}' -f $_)
          }
          exit 0

      # Diagnostic: stop the monitor and summarize %RUNNER_TEMP%\memlog.txt
      # while the run is alive (worst cl.exe lines, one per distinct src with
      # its peak private memory, then the log tail), so even a timeout-killed
      # build still shows which settings sources caused C1060/commit-limit
      # thrash. Must never fail; the raw log is attached by the next step.
      - name: Memory monitor report
        if: always()
        shell: pwsh
        run: |
          try {
            $log = Join-Path $env:RUNNER_TEMP 'memlog.txt'
            if (Test-Path -LiteralPath $log) {
              Get-CimInstance Win32_Process -Filter "Name='pwsh.exe'" |
                Where-Object CommandLine -like '*memmon.ps1*' |
                Invoke-CimMethod -MethodName Terminate
              $lines = @(Get-Content -LiteralPath $log)
              Write-Host ('memlog.txt: {0} lines' -f $lines.Count)
              $best = @{}
              foreach ($line in $lines) {
                if ($line -notmatch 'priv=([0-9.]+)GB') { continue }
                $priv = [double]$Matches[1]
                $src = if ($line -match ' src=(.*)$') { $Matches[1] } else { '<no src>' }
                $prev = $best[$src]
                if (-not $prev -or $priv -gt $prev.priv) {
                  $best[$src] = [pscustomobject]@{ priv = $priv; line = $line }
                }
              }
              Write-Host 'Top 25 cl.exe samples by private memory (actual line per src, max priv kept):'
              $best.Values | Sort-Object priv -Descending | Select-Object -First 25 | ForEach-Object { Write-Host $_.line }
              Write-Host 'Last 60 lines of memlog.txt:'
              $lines | Select-Object -Last 60 | ForEach-Object { Write-Host $_ }
            } else {
              Write-Host ('No {0}; the monitor never produced a sample' -f $log)
            }
          } catch {
            Write-Host ('Memory monitor report failed: {0}' -f $_)
          }
          exit 0

      # Attach the raw memlog.txt as an artifact: a full diagnosis must also
      # survive a timed-out job, not only its final report above (same pinned
      # upload action as the setup artifact in this job).
      - name: Upload memory log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: memlog
          path: ${{ runner.temp }}/memlog.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Make sure d3dcompiler_47.dll is in ReleasePath
        if: steps.libraries.outcome == 'success'
        shell: cmd
        run: |
          setlocal enabledelayedexpansion
          if not exist "%RELEASEPATH%\modules\x64\d3d\d3dcompiler_47.dll" (
            set "D3DDLL="
            if not "%WindowsSdkDir%"=="" if exist "%WindowsSdkDir%Redist\um\x64\d3dcompiler_47.dll" set "D3DDLL=%WindowsSdkDir%Redist\um\x64\d3dcompiler_47.dll"
            if "!D3DDLL!"=="" for /r "%ProgramFiles(x86)%\Windows Kits\10" %%f in (Redist\um\x64\d3dcompiler_47.dll) do if exist "%%f" set "D3DDLL=%%f"
            if "!D3DDLL!"=="" (echo ::error::d3dcompiler_47.dll not found in out\Release nor in the Windows SDK Redist& exit /b 1)
            echo Copying !D3DDLL!
            md "%RELEASEPATH%\modules\x64\d3d" 2>nul
            copy /y "!D3DDLL!" "%RELEASEPATH%\modules\x64\d3d\d3dcompiler_47.dll"
          )

      - name: Ensure Inno Setup 6 (ISCC)
        if: steps.libraries.outcome == 'success'
        shell: cmd
        run: |
          set "ISCC="
          for %%d in ("%ProgramFiles(x86)%\Inno Setup 6" "%ProgramFiles%\Inno Setup 6") do if exist "%%d\ISCC.exe" set "ISCC=%%d\ISCC.exe"
          if "%ISCC%"=="" (
            echo Inno Setup 6 not found; installing via Chocolatey.
            choco install innosetup --no-progress -y
            for %%d in ("%ProgramFiles(x86)%\Inno Setup 6" "%ProgramFiles%\Inno Setup 6") do if exist "%%d\ISCC.exe" set "ISCC=%%d\ISCC.exe"
          )
          if "%ISCC%"=="" (echo ::error::ISCC.exe not found even after installing innosetup& exit /b 1)
          echo ISCC=%ISCC%>>%GITHUB_ENV%

      - name: Prepare setup.iss (remove compiled-out Updater)
        if: steps.libraries.outcome == 'success'
        env:
          TDESKTOP_DIR: ${{ env.TBUILD }}\${{ env.REPO_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          src="$TDESKTOP_DIR/Telegram/build/setup.iss"
          dest="$TDESKTOP_DIR/Telegram/build/setup.sb.iss"
          marker='Source: "{#ReleasePath}\Updater.exe"'
          n=$(grep -cF "$marker" "$src" || true)
          if [ "$n" -ne 1 ]; then
            echo "::error::Expected exactly 1 Updater.exe Source line in setup.iss, found $n"
            exit 1
          fi
          # Same directory keeps {#SourcePath} (SetupIconFile) valid.
          grep -Fv "$marker" "$src" > "$dest"

      - name: Read version from Telegram/build/version
        if: steps.libraries.outcome == 'success'
        env:
          TDESKTOP_DIR: ${{ env.TBUILD }}\${{ env.REPO_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          verfile="$TDESKTOP_DIR/Telegram/build/version"
          app_version_str_small=$(awk '$1=="AppVersionStrSmall" { print $2 }' "$verfile")
          app_version_str=$(awk '$1=="AppVersionStr" { print $2 }' "$verfile")
          if [ -z "$app_version_str_small" ] || [ -z "$app_version_str" ]; then
            echo "::error::Could not read AppVersionStrSmall/AppVersionStr from $verfile"
            exit 1
          fi
          echo "APP_VERSION_STR_SMALL=$app_version_str_small" >> "$GITHUB_ENV"
          echo "APP_VERSION_STR=$app_version_str" >> "$GITHUB_ENV"

      - name: Build installer
        if: steps.libraries.outcome == 'success'
        env:
          REF: ${{ needs.decide.outputs.ref }}
          OUTPUT_BASE_FILENAME: 64gram-${{ needs.decide.outputs.ref }}-windows-x64-setup
        shell: cmd
        run: |
          "%ISCC%" /dMyAppVersion=%APP_VERSION_STR_SMALL% /dMyAppVersionZero=%APP_VERSION_STR% /dMyAppVersionFull=%APP_VERSION_STR% "/dReleasePath=%RELEASEPATH%" /dMyBuildTarget=win64 /dMyOutputBaseFilename=%OUTPUT_BASE_FILENAME% "%TBUILD%\%REPO_NAME%\Telegram\build\setup.sb.iss" || goto error
          if not exist "%RELEASEPATH%\%OUTPUT_BASE_FILENAME%.exe" (
            echo ::error::Installer exe was not produced at %RELEASEPATH%\%OUTPUT_BASE_FILENAME%.exe
            exit /b 1
          )
          del "%TBUILD%\%REPO_NAME%\Telegram\build\setup.sb.iss"
          goto end
          :error
          echo ::error::iscc failed
          exit /b 1
          :end
          exit /b 0

      - name: Stage installer artifact
        if: steps.libraries.outcome == 'success'
        env:
          OUTPUT_BASE_FILENAME: 64gram-${{ needs.decide.outputs.ref }}-windows-x64-setup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          relpath="$RELEASEPATH"
          relpath="${relpath//\\//}"
          cp "$relpath/$OUTPUT_BASE_FILENAME.exe" "dist/$OUTPUT_BASE_FILENAME.exe"
          ls -l dist

      - name: Upload Windows setup artifact
        if: steps.libraries.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-x64-setup
          path: dist/
          if-no-files-found: error

  release:
    name: Release 64Gram Windows
    needs: [decide, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      NEW_REF: ${{ needs.decide.outputs.ref }}
      GH_TOKEN: ${{ github.token }}
      # No checkout in this job, so tell gh which repository to use.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download Windows setup artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-x64-setup
          path: release_artifacts

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "release_artifacts/64gram-*.exe"

      - name: Append exe sha256 to SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          exe="64gram-${NEW_REF}-windows-x64-setup.exe"
          sha_file="SHA256SUMS"

          if [ ! -f "release_artifacts/$exe" ]; then
            echo "::error::Missing artifact $exe"
            exit 1
          fi

          assets=$(gh release view "64gram-${NEW_REF}" --json assets --jq '.assets[].name')
          if grep -Fxq "$sha_file" <<< "$assets"; then
            gh release download "64gram-${NEW_REF}" --pattern "$sha_file" --dir "$RUNNER_TEMP/sums" --clobber
            cp "$RUNNER_TEMP/sums/$sha_file" "$sha_file"
          else
            echo "::notice::No existing $sha_file asset on release 64gram-${NEW_REF}; creating a new one"
            : > "$sha_file"
          fi

          # Drop any previous line for the same file name (both `hash  name` and
          # `hash *name` styles), then append the current one.
          awk -v exe="$exe" 'NF==0 { print; next } { second=$2; if (second == exe || second == "*" exe) next; print }' "$sha_file" > "$sha_file.tmp"
          mv "$sha_file.tmp" "$sha_file"
          ( cd release_artifacts && sha256sum "$exe" ) >> "$sha_file"

          gh release upload "64gram-${NEW_REF}" --clobber "release_artifacts/$exe" "$sha_file"

      - name: Append Windows section to release notes
        shell: bash
        run: |
          set -euo pipefail
          exe="64gram-${NEW_REF}-windows-x64-setup.exe"

          gh release view "64gram-${NEW_REF}" --json body --jq '.body // ""' > notes.md
          if grep -q '^### Windows' notes.md; then
            echo "Windows section already present in release notes"
            exit 0
          fi
          {
            cat notes.md
            echo ""
            echo "### Windows"
            echo "- **Windows installer**: unsigned per-user installer (\`$exe\`), no admin rights required."
            echo "- Windows may show a SmartScreen warning: choose **More info** then **Run anyway**."
            echo "- Verify the checksum with \`sha256sum -c SHA256SUMS\` and the build provenance with \`gh attestation verify $exe --owner ${GITHUB_REPOSITORY%/*}\`."
          } > notes.md.new
          mv notes.md.new notes.md
          gh release edit "64gram-${NEW_REF}" --notes-file notes.md
