name: Lint and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v

      - name: Run actionlint
        shell: bash
        run: |
          set -euo pipefail
          # SC2129 (group >> redirects) is a style preference; everything else stays on.
          docker run --rm -e SHELLCHECK_OPTS=--exclude=SC2129 -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
