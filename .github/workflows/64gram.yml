name: 64Gram

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      approve_ref:
        description: 'A tag a human reviewed; skips the gate for exactly that ref'
        required: false
        type: string
      force_build:
        description: 'Force build even if ref already built'
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: 64gram
  cancel-in-progress: false

jobs:
  check:
    name: Check upstream updates
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      new_ref: ${{ steps.check_ref.outputs.new_ref }}
      audited_ref: ${{ steps.check_ref.outputs.audited_ref }}
      audited_base: ${{ steps.check_ref.outputs.audited_base }}
      proceed: ${{ steps.check_ref.outputs.proceed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check upstream ref and state
        id: check_ref
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVE_REF: ${{ inputs.approve_ref }}
          FORCE_BUILD: ${{ inputs.force_build }}
        shell: bash
        run: |
          set -euo pipefail

          audited_ref=""
          audited_base=""
          built_ref=""
          if [ -f state/64gram.json ]; then
            audited_ref=$(jq -r '.audited_ref // ""' state/64gram.json)
            audited_base=$(jq -r '.audited_base // ""' state/64gram.json)
            built_ref=$(jq -r '.built_ref // ""' state/64gram.json)
          fi

          if [ -n "$APPROVE_REF" ]; then
            new_ref="$APPROVE_REF"
          else
            new_ref=$(gh api repos/TDesktop-x64/tdesktop/releases/latest --jq .tag_name)
          fi

          if [[ ! "$new_ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid new_ref format: $new_ref"
            exit 1
          fi

          proceed="false"
          if [ "$new_ref" != "$built_ref" ] || [ "$FORCE_BUILD" = "true" ] || [ -n "$APPROVE_REF" ]; then
            proceed="true"
          fi

          echo "new_ref=$new_ref" >> "$GITHUB_OUTPUT"
          echo "audited_ref=$audited_ref" >> "$GITHUB_OUTPUT"
          echo "audited_base=$audited_base" >> "$GITHUB_OUTPUT"
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

  scan:
    name: Scan upstream changes
    needs: check
    if: needs.check.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    outputs:
      gate: ${{ steps.eval_gate.outputs.gate }}
      new_base: ${{ steps.run_scan.outputs.new_base }}
      old_base: ${{ steps.run_scan.outputs.old_base }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Clone upstream and run scanner
        id: run_scan
        env:
          AUDITED_REF: ${{ needs.check.outputs.audited_ref }}
          NEW_REF: ${{ needs.check.outputs.new_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/TDesktop-x64/tdesktop upstream
          git -C upstream fetch origin "$AUDITED_REF"
          git -C upstream fetch origin "$NEW_REF"

          # write to a file first: `git show | head` fails under pipefail (SIGPIPE on the large changelog)
          git -C upstream show "$AUDITED_REF:changelog.txt" > "$RUNNER_TEMP/changelog-old.txt"
          first_line_old=$(head -n 1 "$RUNNER_TEMP/changelog-old.txt")
          old_ver=$(echo "$first_line_old" | awk '{print $1}')
          if [[ ! "$old_ver" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Invalid old base version format: $old_ver"
            exit 1
          fi
          old_base="v$old_ver"

          git -C upstream show "$NEW_REF:changelog.txt" > "$RUNNER_TEMP/changelog-new.txt"
          first_line_new=$(head -n 1 "$RUNNER_TEMP/changelog-new.txt")
          new_ver=$(echo "$first_line_new" | awk '{print $1}')
          if [[ ! "$new_ver" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Invalid new base version format: $new_ver"
            exit 1
          fi
          new_base="v$new_ver"

          # --no-tags: official tdesktop has its own v1.x tags from 2017-2018 with the
          # same names as 64Gram releases; auto-followed tags must never shadow them.
          git -C upstream fetch --no-tags https://github.com/telegramdesktop/tdesktop "refs/tags/$old_base:refs/tags/upstream-$old_base"
          git -C upstream fetch --no-tags https://github.com/telegramdesktop/tdesktop "refs/tags/$new_base:refs/tags/upstream-$new_base"

          mkdir -p subs-old subs-new
          bash scripts/subdelta.sh upstream "$AUDITED_REF" subs-old "upstream-$old_base"
          bash scripts/subdelta.sh upstream "$NEW_REF" subs-new "upstream-$new_base"

          rc=0
          python3 scripts/scan.py \
            --repo upstream \
            --old "$AUDITED_REF" \
            --new "$NEW_REF" \
            --base-old "upstream-$old_base" \
            --base-new "upstream-$new_base" \
            --subs-old subs-old \
            --subs-new subs-new \
            --profile tdesktop-fork \
            --trackers data/exodus-trackers.json \
            --report report.md \
            --json report.json || rc=$?

          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "old_base=$old_base" >> "$GITHUB_OUTPUT"
          echo "new_base=$new_base" >> "$GITHUB_OUTPUT"

      - name: Upload scan report and subdelta artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: scan-report
          path: |
            report.md
            report.json
            subs-old
            subs-new
          if-no-files-found: ignore

      - name: Evaluate scan results
        id: eval_gate
        env:
          RC: ${{ steps.run_scan.outputs.rc }}
          APPROVE_REF: ${{ inputs.approve_ref }}
          NEW_REF: ${{ needs.check.outputs.new_ref }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$RC" -eq 2 ]; then
            echo "::error::Scanner failed with usage or internal error (exit code 2)"
            exit 2
          fi

          if [ "$RC" -ne 0 ] && [ "$RC" -ne 10 ]; then
            echo "::error::Scanner failed with unexpected exit code $RC"
            exit "$RC"
          fi

          if [ "$RC" -eq 10 ] && [ "$APPROVE_REF" != "$NEW_REF" ]; then
            gh label create needs-review --description "Requires manual review" || true

            target_title="64Gram $NEW_REF needs review"
            issue_number=$(gh issue list --state open --search "$target_title" --json number,title | jq -r --arg target "$target_title" '.[] | select(.title == $target) | .number' | head -n 1)

            head -c 60000 report.md > issue_body.md
            printf "\n\n---\n[View full scan report artifact](%s/%s/actions/runs/%s)\n" \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> issue_body.md

            if [ -n "$issue_number" ]; then
              gh issue edit "$issue_number" --body-file issue_body.md
            else
              gh issue create --title "$target_title" --label "needs-review" --body-file issue_body.md
            fi

            echo "gate=blocked" >> "$GITHUB_OUTPUT"
          else
            echo "gate=pass" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build 64Gram (Linux x86_64)
    needs: [check, scan]
    if: needs.scan.outputs.gate == 'pass'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read
    env:
      IMAGE_TAG: tdesktop:centos_env
    steps:
      - name: Checkout 64Gram
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: TDesktop-x64/tdesktop
          ref: ${{ needs.check.outputs.new_ref }}
          submodules: recursive

      - name: Nested submodules
        shell: bash
        run: |
          set -euo pipefail
          git -C cmake submodule update --init --recursive --depth=1

      - name: Checkout secure-builds scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: secure-builds

      - name: Validate API secrets
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$API_ID" =~ ^[0-9]{3,12}$ ]] || [[ ! "$API_HASH" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::TDESKTOP_API_ID/TDESKTOP_API_HASH secret missing or malformed"
            exit 1
          fi

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        with:
          tool-cache: true
          large-packages: false

      - name: Apply hardening patches
        shell: bash
        run: |
          set -euo pipefail
          python3 secure-builds/scripts/harden_64gram.py .

      - name: Generate Dockerfile
        shell: bash
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt install -y python3-jinja2
          cd Telegram/build/docker/centos_env
          DOCKERFILE=$(DEBUG="" python3 gen_dockerfile.py)
          echo "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Libraries cache
        id: cache-libs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ runner.temp }}/.buildx-cache
            ${{ runner.temp }}/.mount-cache
          key: ${{ runner.OS }}-libsrel-${{ hashFiles('Telegram/build/docker/centos_env/**') }}
          restore-keys: ${{ runner.OS }}-libsrel-

      - name: Restore Docker cache mounts
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: ${{ runner.temp }}/.mount-cache
          dockerfile: Telegram/build/docker/centos_env/Dockerfile
          skip-extraction: ${{ steps.cache-libs.outputs.cache-hit }}

      - name: Build Libraries image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: Telegram/build/docker/centos_env
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max

      - name: Move cache
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/.buildx-cache"
          mv "$RUNNER_TEMP/.buildx-cache-new" "$RUNNER_TEMP/.buildx-cache"

      - name: Save Libraries cache
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ runner.temp }}/.buildx-cache
            ${{ runner.temp }}/.mount-cache
          key: ${{ steps.cache-libs.outputs.cache-primary-key }}

      - name: Generate stub DesktopPrivate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../DesktopPrivate
          random_key() {
            printf -- '-----BEGIN RSA PRIVATE KEY-----\\n%s\\n-----END RSA PRIVATE KEY-----\\n' \
              "$(head -c 96 /dev/urandom | base64 | tr -d '\n')"
          }
          printf 'const char *PrivateKey = "%s";\nconst char *PrivateBetaKey = "%s";\n' \
            "$(random_key)" "$(random_key)" > ../DesktopPrivate/packer_private.h
          printf 'static const char *AlphaPrivateKey = "%s";\n' \
            "$(random_key)" > ../DesktopPrivate/alpha_private.h

      - name: Telegram Desktop build
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        shell: bash
        run: |
          set -euo pipefail
          # DESKTOP_APP_ENABLE_LTO=OFF: LTO doubles build time on a 4-core runner.
          # Without LTO, GCC 15 inlines official Telegram code differently, and
          # -Werror (set by DESKTOP_APP_SPECIAL_TARGET, which we keep because it
          # also selects the official linking/packaging mode) turns GCC's
          # inlining-dependent flow warnings into hard errors. Seen so far:
          # aggressive-loop-optimizations (statistics_data_deserialize.cpp) and
          # dangling-pointer (history_view_voice_record_bar.cpp). Downgrade only
          # that family to warnings, and APPEND to the image's CXXFLAGS so its
          # hardening flags (-fhardened, -O3, ...) stay.
          # shellcheck disable=SC2016  # $CXXFLAGS must expand inside the container
          docker run --rm \
            -u "$(id -u)" \
            -v "$PWD":/usr/src/tdesktop \
            -v "$PWD/../DesktopPrivate":/usr/src/DesktopPrivate \
            -e CONFIG=Release \
            -e KEEP_GOING=1 \
            "$IMAGE_TAG" \
            bash -c 'export CXXFLAGS="$CXXFLAGS -Wno-error=aggressive-loop-optimizations -Wno-error=dangling-pointer -Wno-error=maybe-uninitialized -Wno-error=array-bounds -Wno-error=use-after-free -Wno-error=restrict"; exec /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh "$@"' build.sh \
            -D CMAKE_CONFIGURATION_TYPES=Release \
            -D DESKTOP_APP_ENABLE_LTO=OFF \
            -D TDESKTOP_API_ID="$API_ID" \
            -D TDESKTOP_API_HASH="$API_HASH" \
            -D DESKTOP_APP_SPECIAL_TARGET=linux \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: Package release archive
        env:
          NEW_REF: ${{ needs.check.outputs.new_ref }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package_dir
          cp out/Release/Telegram package_dir/
          cat << 'EOF' > package_dir/README.txt
          64Gram (unofficial Telegram Desktop for Linux)
          Hardened, audited build by Secure Builds pipeline.

          Hardened defaults applied:
          - Startup unsigned custom lang pack fetch disabled (tdesktop-x64.github.io).
          - Radio controller default endpoint cleared (prevents POSTing group-call hashes).
          - Auto-updates disabled (updates handled via releases).
          - Crash reports disabled.
          EOF

          TARBALL="64gram-${NEW_REF}-linux-x86_64.tar.gz"
          tar -czf "$TARBALL" -C package_dir Telegram README.txt
          sha256sum "$TARBALL" > SHA256SUMS

          mkdir -p dist
          mv "$TARBALL" SHA256SUMS dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build-artifacts
          path: dist/

  release:
    name: Release 64Gram
    needs: [check, scan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: build-artifacts
          path: release_artifacts

      - name: Download scan report
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: scan-report
          path: scan-report

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "release_artifacts/64gram-*.tar.gz"

      - name: Create release
        env:
          NEW_REF: ${{ needs.check.outputs.new_ref }}
          NEW_BASE: ${{ needs.scan.outputs.new_base }}
          APPROVE_REF: ${{ inputs.approve_ref }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp scan-report/report.md ./scan-report.md

          TARBALL="64gram-${NEW_REF}-linux-x86_64.tar.gz"

          {
            echo "## 64Gram ${NEW_REF}"
            echo ""
            echo "Rebuilt from [TDesktop-x64/tdesktop](https://github.com/TDesktop-x64/tdesktop) tag \`${NEW_REF}\` (based on official Telegram Desktop \`${NEW_BASE}\`)."
            echo ""
            echo "### Verification"
            echo "- **Checksum verification**:"
            echo "  \`\`\`bash"
            echo "  sha256sum -c SHA256SUMS"
            echo "  \`\`\`"
            echo "- **Build provenance verification**:"
            echo "  \`\`\`bash"
            echo "  gh attestation verify ${TARBALL} --owner ${GITHUB_REPOSITORY%/*}"
            echo "  \`\`\`"
            echo ""
            echo "### Hardened defaults"
            echo "This rebuild enforces hardened defaults:"
            echo "- **Unsigned UI string pack disabled**: startup fetch of custom language packs from \`tdesktop-x64.github.io\` commented out in \`localstorage.cpp\`."
            echo "- **Radio controller disabled**: default \`http://localhost:2468\` endpoint cleared in \`enhanced_settings.cpp\` so group-call join/leave hashes are not POSTed."
            echo "- **In-app updater disabled**: updates are handled via releases."
            echo "- **Crash reports disabled**: crash report uploads disabled."
            echo ""
            if [ -n "$APPROVE_REF" ]; then
              echo "> [!NOTE]"
              echo "> This release was manually approved by a human maintainer following review."
              echo ""
            fi
            echo "### Security scan"
            echo "See attached \`scan-report.md\` for the full deterministic scanner report."
          } > release_notes.md

          gh release create "64gram-${NEW_REF}" \
            --title "64Gram ${NEW_REF}" \
            --notes-file release_notes.md \
            release_artifacts/"$TARBALL" \
            release_artifacts/SHA256SUMS \
            scan-report.md

      - name: Update repository state
        env:
          NEW_REF: ${{ needs.check.outputs.new_ref }}
          NEW_BASE: ${{ needs.scan.outputs.new_base }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git checkout main
          git pull --rebase origin main

          tmp=$(mktemp)
          jq --arg ref "$NEW_REF" --arg base "$NEW_BASE" \
            '.built_ref = $ref | .audited_ref = $ref | .audited_base = $base' \
            state/64gram.json > "$tmp"
          mv "$tmp" state/64gram.json

          git add state/64gram.json
          if ! git diff --cached --quiet; then
            git commit -m "Update 64Gram state to ${NEW_REF} [skip ci]"
            git push origin main
          fi

      - name: Close review issue
        env:
          NEW_REF: ${{ needs.check.outputs.new_ref }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target_title="64Gram $NEW_REF needs review"
          release_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/64gram-$NEW_REF"

          issue_numbers=$(gh issue list --state open --search "$target_title" --json number,title | jq -r --arg target "$target_title" '.[] | select(.title == $target) | .number')

          for num in $issue_numbers; do
            gh issue comment "$num" --body "Released in [64Gram $NEW_REF]($release_url)."
            gh issue close "$num"
          done
